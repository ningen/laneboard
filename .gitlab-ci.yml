# Linux smoke for the board CLI (desktop installers still ship from GitHub Actions).
stages:
  - test
  - build

variables:
  CARGO_TERM_COLOR: always
  CARGO_HOME: ${CI_PROJECT_DIR}/.cargo

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .cargo/
    - target/

.test-rust:
  image: rust:bookworm
  before_script:
    # rust-toolchain.toml pins 1.99.0; rustup installs it on first cargo invoke.
    - rustc --version && cargo --version

test:
  extends: .test-rust
  stage: test
  script:
    - cargo test -p board-core -p board --locked

build-cli:
  extends: .test-rust
  stage: build
  script:
    - cargo build -p board --release --locked
  artifacts:
    name: board-linux-${CI_COMMIT_SHORT_SHA}
    paths:
      - target/release/board
    expire_in: 1 week
